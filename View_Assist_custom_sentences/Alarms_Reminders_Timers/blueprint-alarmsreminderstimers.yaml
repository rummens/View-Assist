# To do:
# Fix time remaining for translation of '2 hours' to 'two hours' or some sort of correlation for matching
# When asking to list timers show countdown if only one exists
blueprint:
  name: View Assist - Alarms Reminders Timers
  description: Ask Assist to set an alarm, reminder, or timer  (View Assist alarmsreminderstimers v 1.0.0)
  domain: automation
  input:
    language:
      name: Language
      description: Select the language for voice responses
      default: en
      selector:
        select:
          mode: dropdown
          options:
            - value: en
              label: English
            - value: de
              label: Deutsch
            - value: es
              label: Español
            - value: fr
              label: Français
    alarmsound_path:
      name: Alarm Sound Path
      description: The path to the sound file that will sound repeatedly when the timer expires
      default: "http://192.168.0.25:8123/local/viewassist/alarm1.mp3"
    snooze_time:
      name: Snooze Time
      description: The amount of time in minutes to wait after hitting snooze button before sounding alarm again
      default: "10"
    use_24hr:
      name: Use 24 hour time
      description: Set this to true for 24 hour time and false for am/pm display of time for notifications
      default: false
      selector:
        boolean:
    view:
      name: View
      description: The View Assist dashboard view to use for displaying the notification and buttons to dismiss/snooze
      default: "/view-assist/alarm"
    info:
      name: Info
      description: The View Assist dashboard view to use for displaying information about timers
      default: "/view-assist/info"

    sentences_set_timer:
      name: Sentences - Set Timer
      description: List of sentences to set a timer
      default:
        - set [a] timer for {when}
        - set [a] {when} timer
        - (set|start) [a|an] {name} timer for {when}
      selector:
        object:
    sentences_set_reminder:
      name: Sentences - Set Reminder
      description: List of sentences to set a reminder
      default:
        - (remind me | set a reminder) to {name} at {when}
        - remind me to {name} in {when} | set a reminder to {name} in {when}
        - remind me in {when} to {name}
      selector:
        object:
    sentences_set_alarm:
      name: Sentences - Set Alarm
      description: List of sentences to set an alarm
      default:
        - Set [an] alarm for {when}
        - Set [an] {name} alarm for {when}
      selector:
        object:

    sentences_cancel_timer:
      name: Sentences - Cancel Timer
      description: List of sentences to cancel a timer
      default:
        - cancel [my] {name} timer
        - stop [my] {name} timer
        - cancel [my] timer
        - stop [my] timer
      selector:
        object:
    sentences_cancel_alarm:
      name: Sentences - Cancel Alarm
      description: List of sentences to cancel an alarm
      default:
        - cancel [my] {name} alarm
        - stop [my] {name} alarm
        - cancel [my] alarm
        - stop [my] alarm
      selector:
        object:
    sentences_cancel_reminder:
      name: Sentences - Cancel Reminder
      description: List of sentences to cancel a reminder
      default:
        - cancel [my] {name} reminder
        - stop [my] {name} reminder
        - cancel [my] reminder
        - stop [my] reminder
      selector:
        object:

    sentences_list_timers:
      name: Sentences - List Timers
      description: List of sentences to list active timers
      default:
        - (list|show|get) my timers
        - (list|show|get) my timer
        - what timers are set
        - what timers do I have
      selector:
        object:
    sentences_list_alarms:
      name: Sentences - List Alarms
      description: List of sentences to list active alarms
      default:
        - (list|show|get) my alarms
        - (list|show|get) my alarm
        - what alarms are set
        - what alarms do I have
      selector:
        object:
    sentences_list_reminders:
      name: Sentences - List Reminders
      description: List of sentences to list active reminders
      default:
        - (list|show|get) my reminders
        - (list|show|get) my reminder
        - what reminders are set
        - what reminders do I have
      selector:
        object:

    sentences_turnoff_alarm:
      name: Sentences - Turn Off Alarm
      description: List of sentences to turn off an alarm
      default:
        - (Turn off | cancel | stop | snooze) alarm
      selector:
        object:
    sentences_time_remaining:
      name: Sentences - Timer Time Remaining
      description: List of sentences to check time left on a timer
      default:
       - how much time (is) left on my {name} timer
       - how much time (is) left on my timer
      selector:
        object:

    warning_alarm_actions:
        description: optional actions to run before warning/alarm is being triggered
        name: Warning/Alarm Pre Actions
        selector:
          action: {}

trigger:
  - platform: conversation
    command: !input sentences_set_timer
    id: timer
  - platform: conversation
    command: !input sentences_set_reminder
    id: reminder
  - platform: conversation
    command: !input sentences_set_alarm
    id: alarm
  - platform: conversation
    command: !input sentences_turnoff_alarm
    id: turnoffalarm
  - event_type: va_timer_warning
    id: timerwarning
    trigger: event
    alias: When viewassist event warning expired fires
  - event_type: va_timer_expired
    id: ringalarm
    trigger: event
    alias: When viewassist event timer expired fires
  - platform: conversation
    command: !input sentences_time_remaining
    id: timeremaining
  - platform: conversation
    command: !input sentences_cancel_timer
    id: canceltimer
  - platform: conversation
    command: !input sentences_cancel_alarm
    id: cancelalarm
  - platform: conversation
    command: !input sentences_cancel_reminder
    id: cancelreminder
  - platform: conversation
    command: !input sentences_list_timers
    id: listtimer
  - platform: conversation
    command: !input sentences_list_alarms
    id: listalarm
  - platform: conversation
    command: !input sentences_list_reminders
    id: listreminder
  - alias: When SNOOZE button pressed
    event_type: viewassist
    trigger: event
    id: snoozealarm
    enabled: true
    event_data:
      command: snooze alarm
  - alias: When DISMISS button pressed
    event_type: viewassist
    trigger: event
    id: turnoffalarm
    enabled: true
    event_data:
      command: dismiss alarm


condition: []

action:
  - variables:
      target_satellite_device: >
        {{ view_assist_entity(trigger.device_id)
           if trigger.platform == 'conversation'
           else trigger.event.data.entity_id }}
      target_musicplayer_device: "{{ state_attr(target_satellite_device, 'musicplayer_device') }}"
      target_mediaplayer_device: "{{ state_attr(target_satellite_device, 'mediaplayer_device') }}"
      target_satellite_device_type: "{{ state_attr(target_satellite_device, 'type') }}"
      alarmsound_path: !input alarmsound_path
      view: !input view
      info: !input info
      snooze_time_input: !input snooze_time
      snooze_time: "{{ snooze_time_input | int }}"
      use_24hr: !input use_24hr
      language: !input language
      translations:
        en:
          responses:
            timer_set: "{name} {type} set for {time}"
            time_left: "You have {time_left} on your {name} {type}"
            no_timer_found: "No {type} called {name} could be found"
            timer_cancelled: "Your {name} {type} has been canceled"
            timer_cancel_failed: "I could not find an active {type} called {name}"
            no_active_timers: "There are no active {type}s."
            list_single_timer: "There is one active {name} {type} with {time_left} remaining"
            list_single_alarm: "There is one active {type} called {name} for {expiry}"
            list_multiple: "There are {count} active {type}s"

        de:
          responses:
            timer_set: "{name} {type} wurde für {time} gesetzt"
            time_left: "Dein {name} {type} läuft noch {time_left}"
            no_timer_found: "Kein {type} namens {name} wurde gefunden"
            timer_cancelled: "Dein {name} {type} wurde gelöscht"
            timer_cancel_failed: "Ich konnte keinen aktiven {type} namens {name} finden"
            no_active_timers: "Es gibt keine aktiven {type}s."
            list_single_timer: "Es gibt einen aktiven {name} {type}, verbleibende Zeit: {time_left}"
            list_single_alarm: "Es gibt einen aktiven {type} namens {name} für {expiry}"
            list_multiple: "Es gibt {count} aktive {type}s"

        es:
          responses:
            timer_set: "{name} {type} configurado para {time}"
            time_left: "Te queda {time_left} en tu {type} {name}"
            no_timer_found: "No se encontró un {type} llamado {name}"
            timer_cancelled: "Tu {type} {name} ha sido cancelado"
            timer_cancel_failed: "No pude encontrar un {type} activo llamado {name}"
            no_active_timers: "No hay {type}s activos."
            list_single_timer: "Hay un {name} {type} activo con {time_left} restante"
            list_single_alarm: "Hay un {type} activo llamado {name} para {expiry}"
            list_multiple: "Hay {count} {type}s activos"

        fr:
          responses:
            timer_set: "{name} {type} réglé pour {time}"
            time_left: "Il reste {time_left} sur votre {type} {name}"
            no_timer_found: "Aucun {type} nommé {name} n'a été trouvé"
            timer_cancelled: "Votre {type} {name} a été annulé"
            timer_cancel_failed: "Je n'ai pas trouvé de {type} actif nommé {name}"
            no_active_timers: "Il n'y a aucun {type} actif."
            list_single_timer: "Il y a un {name} {type} actif avec {time_left} restant"
            list_single_alarm: "Il y a un {type} actif nommé {name} pour {expiry}"
            list_multiple: "Il y a {count} {type}s actifs"


  - choose:
      # ───────────────────────────────────────────────────────────────────────────
      # 1) Set Timer or Alarm
      - conditions:
          - condition: trigger
            id:
              - timer
              - alarm
              - reminder
        sequence:
          - variables:
              device_id: "{{ trigger.device_id }}"
              type: "{{ trigger.id }}"
              time: "{{ trigger.slots.when }}"
              name: "{{ trigger.slots.name }}"
          - action: view_assist.set_timer
            data:
              device_id: "{{ device_id }}"
              type: "{{ type }}"
              time: "{{ time }}"
              name: "{{ name }}"
            response_variable: timer_result
          - set_conversation_response: >-
              {{ translations[language]['responses']['timer_set']
                 .replace('{name}', name)
                 .replace('{type}', type)
                 .replace('{time}', time) }}
          - if:
              - condition: template
                value_template: >-
                  {{ target_satellite_device_type != 'audio_only' }}
            then:
              - action: view_assist.set_state
                target:
                  entity_id: "{{ target_satellite_device }}"
                data:
                  display_timer_expire: "{{ timer_result.timer.expires }}"
                  display_timer_name: "{{ timer_result.timer.name | capitalize }} {% if type != 'timer' %} - {{ timer_result.timer.expiry.text }} {% endif %}"
                  display_timer_type: "{{ type }}"
              - action: view_assist.navigate
                data:
                  device: "{{ target_satellite_device }}"
                  path: "{{ view }}"

      # ───────────────────────────────────────────────────────────────────────────
      # 2) Timer Warning & Expiry
      - conditions:
          - condition: trigger
            id:
              - timerwarning
              - ringalarm
        sequence:
          - variables:
              alarm_type: "{{ trigger.event.data.timer_class }}"
              alarm_name: >-
                {% if trigger.event.data.name is defined %}
                  {{ trigger.event.data.name }}
                {% endif %}
              alarm_id: "{{ trigger.event.data.timer_id }}"
              alarm_time: "{{ trigger.event.data.expires }}"
          # Run optional user-defined actions
          - choose: []
            default: !input warning_alarm_actions
          - action: view_assist.set_state
            target:
              entity_id: "{{ target_satellite_device }}"
            data:
              mode: hold
              display_timer_name: "{{ alarm_name | capitalize }}"
              display_timer_expire: "{{ alarm_time }}"
              display_timer_type: "{{ alarm_type }}"
              display_timer_id: "{{ alarm_id }}"
          - action: view_assist.navigate
            data:
              device: "{{ target_satellite_device }}"
              path: "{{ view }}"
          - if:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'ringalarm' }}
            then:
              - action: view_assist.sound_alarm
                data:
                  entity_id: "{{ target_mediaplayer_device }}"
                  media_file: "{{ alarmsound_path }}"

      # ───────────────────────────────────────────────────────────────────────────
      # 3) Turn Off Alarm (Conversation)
      - conditions:
          - condition: trigger
            id:
              - turnoffalarm
        sequence:
          - variables:
              display_timer_id: >
                {{ state_attr(target_satellite_device, 'display_timer_id') }}
          - action: view_assist.set_state
            target:
              entity_id: "{{ target_satellite_device }}"
            data:
              mode: normal
          - action: view_assist.cancel_sound_alarm
            data:
              entity_id: "{{ target_mediaplayer_device }}"
          - action: view_assist.cancel_timer
            data:
              timer_id: "{{ display_timer_id }}"
          - set_conversation_response: "" # no voice response

      # ───────────────────────────────────────────────────────────────────────────
      # 4) Time Remaining
      - conditions:
          - condition: trigger
            id:
              - timeremaining
        sequence:
          - action: view_assist.get_timers
            data:
              device_id: "{{ trigger.device_id }}"
            response_variable: timer_info
          - variables:
              timer_name_input: "{{ trigger.slots.name if trigger.slots.name is defined else '' }}"
              timer_id: >-
                {% set t = timer_info['result'] %}
                {% for itm in t %}
                  {% if timer_name_input in itm.name or
                        timer_name_input in itm.extra_info.sentence %}
                    {{ itm.id }}
                  {% endif %}
                {% endfor %}
              timer_name: >-
                {% set lst = timer_info['result']
                   | selectattr('id','equalto', timer_id)
                   | list %}
                {% if lst %}{{ lst[0].name | capitalize }}{% endif %}
              time_left: >-
                {% set lst = timer_info['result']
                   | selectattr('id','equalto', timer_id)
                   | list %}
                {% if lst %}{{ lst[0].expiry.text }}{% endif %}
              time_expires: >-
                {% set lst = timer_info['result']
                   | selectattr('id','equalto', timer_id)
                   | list %}
                {% if lst %}{{ lst[0].expires }}{% endif %}
          - if:
              - condition: template
                value_template: >-
                  {{ timer_id != '' }}
            then:
              - set_conversation_response: >-
                  {{ translations[language]['responses']['time_left']
                     .replace('{name}', timer_name)
                     .replace('{time_left}', time_left) }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ target_satellite_device_type != 'audio_only' }}
                then:
                  - action: view_assist.set_state
                    target:
                      entity_id: "{{ target_satellite_device }}"
                    data:
                      display_timer_expire: "{{ time_expires }}"
                      display_timer_name: "{{ timer_name }}"
                  - action: view_assist.navigate
                    data:
                      device: "{{ target_satellite_device }}"
                      path: "{{ view }}"
            else:
              - set_conversation_response: >-
                  {{ translations[language]['responses']['no_timer_found']
                     .replace('{name}', trigger.slots.name) }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ target_satellite_device_type != 'audio_only' }}
                then:
                  - variables:
                      msg: >
                        {{ translations[language]['responses']['no_timer_found']
                           .replace('{name}', trigger.slots.name | capitalize) }}
                  - action: view_assist.set_state
                    target:
                      entity_id: "{{ target_satellite_device }}"
                    data:
                      title: "Timers"
                      message: "{{ msg }}"
                      message_font_size: 3vw
                  - action: view_assist.navigate
                    data:
                      device: "{{ target_satellite_device }}"
                      path: "{{ info }}"

      # ───────────────────────────────────────────────────────────────────────────
      # 5) Cancel Timer
      - conditions:
          - condition: trigger
            id:
              - canceltimer
              - cancelalarm
              - cancelreminder
        sequence:
          - action: view_assist.get_timers
            data:
              device_id: "{{ trigger.device_id }}"
            response_variable: timer_info
          - variables:
              timer_name_input: "{{ trigger.slots.name if trigger.slots.name is defined else '' }}"
              cancel_type: "{{ trigger.id.replace('cancel', '') }}"  # get 'timer', 'alarm', or 'reminder'
              timer_id: >-
                {% set timers = timer_info['result'] %}
                {% set found = namespace(id='') %}
                {% for timer in timers %}
                  {% if found.id == '' and (cancel_type in timer.timer_class | lower) and (timer_name_input in timer.name or timer_name_input in timer.extra_info.sentence) %}
                    {% set found.id = timer.id %}
                  {% endif %}
                {% endfor %}
                {{ found.id }}

              timer_name: >-
                {% set lst = timer_info['result']
                   | selectattr('id','equalto', timer_id)
                   | list %}
                {% if lst %}{{ lst[0].name | capitalize }}{% endif %}

          - if:
              - condition: template
                value_template: >-
                  {{ timer_id != '' }}
            then:
              - set_conversation_response: >-
                  {{ translations[language]['responses']['timer_cancelled']
                    .replace('{name}', timer_name)
                    .replace('{type}', cancel_type) }}
              - action: view_assist.cancel_timer
                data:
                  timer_id: "{{ timer_id }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ target_satellite_device_type != 'audio_only' }}
                then:
                  - variables:
                      msg: >
                        {{ translations[language]['responses']['timer_cancelled']
                          .replace('{name}', timer_name)
                          .replace('{type}', cancel_type) }}
                  - action: view_assist.set_state
                    target:
                      entity_id: "{{ target_satellite_device }}"
                    data:
                      title: "Timers"
                      message: "{{ msg }}"
                      message_font_size: 3vw
                  - action: view_assist.navigate
                    data:
                      device: "{{ target_satellite_device }}"
                      path: "{{ info }}"
            else:
              - set_conversation_response: >-
                  {% if timer_name_input == '' %}
                    {{ translations[language]['responses']['no_active_timers']
                      .replace('{type}', cancel_type) }}
                  {% else %}
                    {{ translations[language]['responses']['timer_cancel_failed']
                        .replace('{name}', timer_name_input)
                        .replace('{type}', cancel_type) }}
                  {% endif %}
              - if:
                  - condition: template
                    value_template: >-
                      {{ target_satellite_device_type != 'audio_only' }}
                then:
                  - variables:
                      msg: >
                        {% if timer_name_input == '' %}
                          {{ translations[language]['responses']['no_active_timers']
                            .replace('{type}', cancel_type) }}
                        {% else %}
                          {{ translations[language]['responses']['timer_cancel_failed']
                              .replace('{name}', timer_name_input)
                              .replace('{type}', cancel_type) }}
                        {% endif %}
                  - action: view_assist.set_state
                    target:
                      entity_id: "{{ target_satellite_device }}"
                    data:
                      title: "Timers"
                      message: "{{ msg }}"
                      message_font_size: 3vw
                  - action: view_assist.navigate
                    data:
                      device: "{{ target_satellite_device }}"
                      path: "{{ info }}"

      # ───────────────────────────────────────────────────────────────────────────
      # 6) List Timers
      - conditions:
          - condition: trigger
            id:
              - listtimer
              - listalarm
              - listreminder
        sequence:
          - action: view_assist.get_timers
            data:
              device_id: "{{ trigger.device_id }}"
            response_variable: timer_info
          - variables:
              list_type: "{{ trigger.id.replace('list', '') }}"  # Extract 'timer', 'alarm', or 'reminder'
          - set_conversation_response: >-
              {% set active_timers = timer_info['result'] | selectattr('status', '!=', 'expired') | selectattr('timer_class', 'search', list_type) | list %}
              {% set count = active_timers | length %}
              {% if count == 0 %}
                {{ translations[language]['responses']['no_active_timers']
                    .replace('{type}', list_type) }}
              {% elif count == 1 %}
                {% if list_type == 'timer' %}
                  {{ translations[language]['responses']['list_single_timer']
                      .replace('{type}', list_type)
                      .replace('{name}', active_timers[0]['name'] or active_timers[0]['extra_info']['sentence'])
                      .replace('{time_left}', active_timers[0]['expiry']['text']) }}
                {% else %}
                  {{ translations[language]['responses']['list_single_alarm']
                      .replace('{type}', list_type)
                      .replace('{name}', active_timers[0]['name'] or active_timers[0]['extra_info']['sentence'])
                      .replace('{expiry}', active_timers[0]['expiry']['text']) }}
                {% endif %}
              {% else %}
                {{ translations[language]['responses']['list_multiple']
                    .replace('{count}', count | string)
                    .replace('{type}', list_type) }}
              {% endif %}
          - if:
              - condition: template
                value_template: >-
                  {{ target_satellite_device_type != 'audio_only' }}
            then:
              - variables:
                  msg: >-
                    {% set active_timers = timer_info['result'] | selectattr('status', '!=', 'expired') | selectattr('timer_class', 'search', list_type) | list %}
                    {% set count = active_timers | length %}
                    {% if count == 0 %}
                      {{ translations[language]['responses']['no_active_timers']
                          .replace('{type}', list_type) }}
                    {% elif count == 1 %}
                      {% if list_type == 'timer' %}
                        {{ translations[language]['responses']['list_single_timer']
                            .replace('{type}', list_type)
                            .replace('{name}', active_timers[0]['name'] or active_timers[0]['extra_info']['sentence'])
                            .replace('{time_left}', active_timers[0]['expiry']['text']) }}
                      {% else %}
                        {{ translations[language]['responses']['list_single_alarm']
                            .replace('{type}', list_type)
                            .replace('{name}', active_timers[0]['name'] or active_timers[0]['extra_info']['sentence'])
                            .replace('{expiry}', active_timers[0]['expiry']['text']) }}
                      {% endif %}
                    {% else %}
                      {{ translations[language]['responses']['list_multiple']
                          .replace('{count}', count | string)
                          .replace('{type}', list_type) }}:<br/><br/>
                      {% for t in active_timers %}
                        {{ (t.name or t.extra_info.sentence) | capitalize }}
                        {{ t.timer_class }} with {{ t.expiry.text }} remaining<br/><br/>
                      {% endfor %}
                    {% endif %}
              - action: view_assist.set_state
                target:
                  entity_id: "{{ target_satellite_device }}"
                data:
                  title: "Timers"
                  message: "{{ msg }}"
                  message_font_size: 3vw
              - action: view_assist.navigate
                data:
                  device: "{{ target_satellite_device }}"
                  path: "{{ info }}"

      # ───────────────────────────────────────────────────────────────────────────
      # 7) Snooze Alarm
      - conditions:
          - condition: trigger
            id:
              - snoozealarm
        sequence:
          - variables:
              new_time: "{{ snooze_time }} minutes"
              display_timer_id: >
                {{ state_attr(target_satellite_device, 'display_timer_id') }}
          - action: view_assist.set_state
            target:
              entity_id: "{{ target_satellite_device }}"
            data:
              mode: normal
          - action: view_assist.cancel_sound_alarm
            data:
              entity_id: "{{ target_mediaplayer_device }}"
          - action: view_assist.snooze_timer
            data:
              timer_id: "{{ display_timer_id }}"
              time: "{{ new_time }}"
          - set_conversation_response: "" # no voice response

mode: parallel